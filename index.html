<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zócalos-Entrevista</title>
<meta name="theme-color" content="#0e161e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e161e;--pn:#17222d;--ln:#2a3a4a;--tx:#eaf1f7;--mu:#8ba2b7;--ac:#1e88d6;--ok:#1f9d57;--bad:#d6453d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:10px 16px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cfg{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
.cfg input[type=number]{width:70px;padding:6px 8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font:inherit}
.cfg label{display:flex;gap:6px;align-items:center;color:var(--mu)}
#file{font-weight:600}
#file.no{color:var(--bad)}
#mic{margin-left:auto;font-weight:600;min-width:200px}
#mic.on{background:var(--bad);border-color:var(--bad)}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 420px;gap:16px;padding:16px}
section{display:flex;flex-direction:column;min-height:0}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:0 0 8px}
#list{flex:1;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px}
.seg{padding:10px 12px;border-radius:6px;cursor:pointer;border-left:4px solid transparent;font-size:var(--fs,18px)}
.seg:hover{background:#1f2e3c}
.seg.on{background:#173c5c;border-left-color:var(--ac)}
.seg.sent{background:#123a22;border-left-color:#1f9d57}
.seg.sent::after{content:" ✔ al aire";font-size:.65em;color:#58e08f;font-weight:700;white-space:nowrap}
.seg.sent.on{background:#1b5a3a;border-left-color:var(--ac)}
#im{padding:10px 12px;color:var(--mu);font-style:italic;font-size:var(--fs,18px)}#im:empty{display:none}#im{cursor:pointer}
#cut{margin-top:8px;padding:14px;font-weight:700;background:var(--ac);border-color:var(--ac)}
textarea{width:100%;flex:1;min-height:140px;resize:none;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:12px;font:600 22px/1.3 "Segoe UI",system-ui,sans-serif}
.row{display:flex;gap:8px;margin:10px 0}
.row button{flex:1}
.seg-b.sel{background:var(--ac);border-color:var(--ac)}
#send{width:100%;padding:18px;font-size:22px;font-weight:700;background:var(--ok);border-color:var(--ok)}
#air{margin-top:12px;padding:10px 12px;border:1px dashed var(--ln);border-radius:6px;color:var(--mu);font-size:15px}
#air b{display:block;color:var(--tx);font-weight:600;margin-top:2px}
#hist{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.hi{display:flex;gap:8px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font-size:14px}
.hi span{flex:1;cursor:pointer}.hi small{color:var(--mu)}
.hi button{padding:6px 10px;font-size:13px;background:var(--ok);border-color:var(--ok)}
section:last-child{overflow:auto}
#pv{white-space:pre-wrap;font:600 15px/1.3 Consolas,monospace;color:var(--mu);background:#0b1117;border:1px dashed var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:10px;min-height:42px}
.pl{display:flex;justify-content:space-between;gap:12px}.pl small{color:var(--mu);font-weight:400;white-space:nowrap}.pl small.bad{color:#ff6b64;font-weight:700}
#pv:empty::before{content:"Tocá PREVIA para ver cómo queda";font-weight:400}
#st{margin:0 0 10px;border-radius:6px;font-weight:800;font-size:26px;line-height:1.2;text-align:center}
#st.ok{padding:14px 10px;background:#123a22;color:#58e08f;border:2px solid #1f9d57}
#st.bad{padding:14px 10px;background:#44181a;color:#ff7a73;border:2px solid #d6453d}
.lnb.sel{background:var(--ac);border-color:var(--ac);font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.hd h2{margin:0}.hd button{padding:6px 12px;font-size:14px;white-space:nowrap}
.fs{display:flex;gap:6px;align-items:center;color:var(--mu)}.fs button{padding:6px 12px;font-weight:700}
#air i{color:#58e08f;font-style:normal;font-weight:600;margin-left:6px}
#prev{padding:18px;font-size:22px;font-weight:700;background:var(--ac);border-color:var(--ac)}
#send:disabled{opacity:.3;cursor:not-allowed}
.row .del{flex:0 1 240px;background:var(--bad);border-color:var(--bad);font-weight:700}
#pvw{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
#pvw #pv{box-sizing:content-box;white-space:pre;overflow:visible;margin:0;flex:none;font-family:Consolas,"Courier New",monospace;font-weight:600;line-height:1.3;font-size:inherit;color:var(--tx);border:2px solid var(--ln);background:#0b1117;min-height:1.3em}
#pvw #pv:empty::before{content:"Tocá PREVIA";color:var(--mu);font-weight:400}
#cnt{font-family:Consolas,"Courier New",monospace;line-height:1.3;color:var(--mu);padding-top:10px;white-space:nowrap}
#cnt .bad{color:#ff6b64;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ok);padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
@media(max-width:800px){main{grid-template-columns:1fr;overflow:auto}#list{min-height:200px}}
</style></head>
<body>
<div class="cfg">
  <button id="pick">Elegir archivo txt</button>
  <span id="file" class="no">Sin archivo elegido</span>
  <label><input type="checkbox" id="up" checked> Mayúsculas</label>
  <label>Máx. caracteres por renglón <input type="number" id="mx" value="40" min="10" max="200"></label>
  <span class="fs">Letra transcripción <button id="fm">A−</button><button id="fp">A+</button></span>
  <small id="ver" style="color:var(--mu)">versión 9-oct-A</small>
  <button id="mic">🎙 Empezar a escuchar</button>
</div>
<main>
  <section>
    <div class="hd"><h2>Lo que se dice (tocá una o varias frases)</h2><button id="new">🗑 Nueva entrevista</button></div>
    <div id="list"><div id="im"></div></div>
    <button id="cut">✂ CORTAR ACÁ · también podés tocar el texto gris</button>
  </section>
  <section>
    <div class="hd"><h2>Zócalo</h2><div style="display:flex;gap:6px"><button id="l1" class="lnb">1 renglón</button><button id="l2" class="lnb sel">2 renglones</button></div></div>
    <textarea id="ed" placeholder="Tocá una frase de la izquierda o escribí acá. Enter baja de renglón."></textarea>
    <div class="row">
      <button class="seg-b sel" id="mq">Con comillas</button>
      <button class="seg-b" id="mt">Titular (sin comillas)</button>
    </div>
    <div id="pvw"><div id="pv"></div><div id="cnt"></div></div><div id="st"></div>
    <div class="row"><button id="prev">👁 PREVIA</button><button id="send" disabled>▶ AIRE</button></div>
    <div class="row" style="justify-content:center"><button id="cls" class="del">Borrar texto</button></div>
    <div id="air">Último enviado<b>—</b></div>
    <h2 style="margin-top:14px">Historial de enviadas (tocá para reutilizar)</h2>
    <div id="hist"></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let fh=null,listening=false,rec=null,quotes=true,cutWords=0,LINES=2;

/* guardar el archivo elegido para no volver a pedirlo */
const db=()=>new Promise((ok,no)=>{const r=indexedDB.open('zocalos',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbGet=async k=>{try{const d=await db();return await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}};
const idbSet=async(k,v)=>{try{const d=await db();await new Promise(ok=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=ok})}catch(e){}};

function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2500)}
function showFile(){const f=$('file');f.textContent=fh?fh.name:'Sin archivo elegido';f.className=fh?'':'no'}

$('pick').onclick=async()=>{
  if(!window.showOpenFilePicker){toast('Abrí esta página con Chrome o Edge',1);return}
  try{[fh]=await showOpenFilePicker({types:[{description:'Texto',accept:{'text/plain':['.txt']}}]});await idbSet('fh',fh);showFile()}catch(e){}
};
(async()=>{fh=await idbGet('fh')||null;showFile();try{$('up').checked=localStorage.up!=='0';if(localStorage.mx)$('mx').value=localStorage.mx}catch(e){}})();
$('mx').onchange=()=>{try{localStorage.mx=MAX()}catch(e){}$('mx').value=MAX();pv()};
$('up').onchange=()=>{try{localStorage.up=$('up').checked?'1':'0'}catch(e){}pv()};

/* escribir el txt: la frase queda en la primera línea */
async function write(txt){
  if(!fh){toast('Primero elegí el archivo txt',1);return false}
  try{
    const o={mode:'readwrite'};
    if(await fh.queryPermission(o)!=='granted'&&await fh.requestPermission(o)!=='granted'){toast('Sin permiso para escribir el archivo',1);return false}
    const w=await fh.createWritable();await w.write(txt);await w.close();
    const back=await (await fh.getFile()).text();
    if(back.replace(/^\uFEFF/,'')!==txt){toast('⚠ Se guardó, pero el txt no coincide: revisalo',1);return false}
    return true
  }catch(e){toast('No se pudo guardar: '+e.message,1);return false}
}
function MAX(){return Math.max(10,parseInt($('mx').value)||40)}
function wrap(l,max){
  const out=[];let cur='';
  for(const w of l.split(' ')){if(!cur)cur=w;else if((cur+' '+w).length<=max)cur+=' '+w;else{out.push(cur);cur=w}}
  if(cur)out.push(cur);return out;
}
function build(){
  let t=$('ed').value.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join(LINES===1?' ':'\n').replace(/^["“”]+|["“”]+$/g,'').trim();
  if(!t)return '';
  if($('up').checked)t=t.toLocaleUpperCase('es');
  if(quotes)t='"'+t+'"';
  /* respeta los Enter del productor y corta según el máximo por renglón configurado */
  return t.split('\n').flatMap(l=>wrap(l,MAX())).join('\r\n')+'\r\n\r\n\r\n\r\n';
}
let okText=null;
/* cualquier cambio invalida la previa: hay que volver a revisar antes de mandar al aire */
function sizePv(){
  const w=$('pvw'),avail=Math.max(120,w.clientWidth-120);
  w.style.fontSize=Math.max(9,Math.min(18,Math.floor(avail/(MAX()*0.6))))+'px';
  $('pv').style.width=MAX()+'ch';
  $('pv').style.minHeight=(LINES*1.3)+'em';
}
window.addEventListener('resize',sizePv);
function pv(){okText=null;$('pv').textContent='';$('cnt').innerHTML='';sizePv();$('st').textContent='';$('st').className='';$('send').disabled=true}
function previa(){
  const t=build();
  if(!t){toast('No hay texto para revisar',1);return}
  const L=t.trim().split(/\r?\n/);
  const pe=$('pv'),ce=$('cnt');pe.innerHTML='';ce.innerHTML='';sizePv();
  L.forEach(l=>{const a=document.createElement('div');a.textContent=l;pe.appendChild(a);const c=document.createElement('div');c.textContent=l.length+' / '+MAX();if(l.length>MAX())c.className='bad';ce.appendChild(c)});
  const long=L.length>LINES||L.some(l=>l.length>MAX());
  $('st').className=long?'bad':'ok';
  $('st').textContent=long?(LINES===1?'✖ MUY LARGO para 1 renglón: '+L.join(' ').length+' caracteres (máx. '+MAX()+'). Acortá la frase.':'✖ MUY LARGO: '+L.length+' renglones (máx. '+LINES+'). Acortá la frase.'):'✔ ENTRA BIEN: '+L.length+(L.length>1?' renglones':' renglón');
  okText=long?null:t;$('send').disabled=long;
}
async function send(){
  const t=build();
  if(!t||t!==okText){toast('Primero tocá PREVIA para revisar la frase',1);return}
  if(await write(t)){
    showAir(t);
    markSent(t);
    document.querySelectorAll('.seg.on').forEach(x=>x.classList.remove('on'));
    addHist(t);
    toast('✔ Enviado y guardado en el txt');pv()
  }
}
/* historial de frases enviadas (se guarda aunque se cierre la página) */
let hist=[];try{hist=JSON.parse(localStorage.hist||'[]')}catch(e){}
function addHist(t){
  hist=hist.filter(x=>x.t!==t);
  const n=new Date();hist.unshift({t,h:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')});
  hist=hist.slice(0,50);try{localStorage.hist=JSON.stringify(hist)}catch(e){}
  renderHist();
}
function renderHist(){
  const h=$('hist');h.innerHTML='';
  hist.forEach(it=>{
    const d=document.createElement('div');d.className='hi';
    const m=document.createElement('small');m.textContent=it.h;
    const s=document.createElement('span');s.textContent=it.t.replace(/\r?\n/g,' ');
    s.onclick=()=>{$('ed').value=it.t.trim();setMode(/^["“]/.test(it.t.trim()))};
    const b=document.createElement('button');b.textContent='Reenviar';
    b.onclick=async()=>{if(await write(it.t)){showAir(it.t);markSent(it.t);addHist(it.t);toast('✔ Enviado y guardado en el txt')}};
    d.append(m,s,b);h.appendChild(d);
  });
}
renderHist();
$('send').onclick=send;$('prev').onclick=previa;
$('cls').onclick=()=>{$('ed').value='';pv();document.querySelectorAll('.seg.on').forEach(x=>x.classList.remove('on'))};
function setMode(q){quotes=q;$('mq').classList.toggle('sel',q);$('mt').classList.toggle('sel',!q);pv()}
$('ed').oninput=pv;
$('mq').onclick=()=>setMode(true);
$('mt').onclick=()=>setMode(false);

/* transcripción */
function add(t){
  if(!t)return;
  const d=document.createElement('div');d.className='seg';d.textContent=t;d.dataset.t=t;
  d.onclick=()=>{d.classList.toggle('on');fillEd()};
  const l=$('list');l.insertBefore(d,$('im'));
  while(l.children.length>151)l.firstChild.remove();
  l.scrollTop=l.scrollHeight;
  return d;
}
function fillEd(){$('ed').value=[...document.querySelectorAll('.seg.on')].map(x=>x.dataset.t).join(' ');pv()}
/* corta lo que se está diciendo, lo deja listo para usar y sigue escuchando */
function cut(){
  const t=$('im').textContent.trim();
  if(!listening||!t)return;
  const d=add(t);$('im').textContent='';
  d.classList.add('on');fillEd();
  cutWords+=t.split(/\s+/).length;
}
$('cut').onclick=cut;$('im').onclick=cut;
function ui(){$('mic').textContent=listening?'⏹ Dejar de escuchar':'🎙 Empezar a escuchar';$('mic').className=listening?'on':''}
function start(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Abrí esta página con Chrome o Edge',1);return}
  rec=new SR();rec.lang='es-UY';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let im='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      const rest=r[0].transcript.trim().split(/\s+/).slice(cutWords).join(' ');
      if(r.isFinal){add(rest);cutWords=0}else im+=rest
    }
    $('im').textContent=im;$('list').scrollTop=$('list').scrollHeight;
  };
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;ui();toast('Permití el micrófono en el navegador',1)}};
  rec.onend=()=>{cutWords=0;if(listening){try{rec.start()}catch(_){setTimeout(()=>{if(listening)start()},500)}}};
  listening=true;ui();rec.start();
}
$('mic').onclick=()=>{if(listening){listening=false;rec&&rec.stop();ui()}else start()};

function showAir(t){const a=$('air');a.innerHTML='Último enviado <i>✔ guardado en el txt</i><b></b>';a.querySelector('b').textContent=t.trim()}
/* nueva entrevista: limpia la transcripción (el historial de enviadas queda) */
$('new').onclick=()=>{
  if(!confirm('¿Limpiar la transcripción para una nueva entrevista?\n(el historial de frases enviadas no se borra)'))return;
  document.querySelectorAll('.seg').forEach(x=>x.remove());
  const t=$('im').textContent.trim();if(t)cutWords+=t.split(/\s+/).length;
  $('im').textContent='';
};
/* tamaño de letra de la transcripción */
let fs=18;try{fs=+localStorage.fs||18}catch(e){}
function setFs(n){fs=Math.min(48,Math.max(14,n));$('list').style.setProperty('--fs',fs+'px');try{localStorage.fs=fs}catch(e){}}
setFs(fs);$('fm').onclick=()=>setFs(fs-2);$('fp').onclick=()=>setFs(fs+2);

/* pinta de verde en la transcripción lo que ya salió al aire */
const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function markSent(t){
  const n=norm(t);
  document.querySelectorAll('.seg').forEach(d=>{
    const m=norm(d.dataset.t);
    if(m.length>=4&&(d.classList.contains('on')||(n.length>=4&&(n.includes(m)||m.includes(n)))))d.classList.add('sent');
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* cantidad de renglones del zócalo: 1 (Info) o 2 (Lado B) */
function setLines(n){LINES=n;$('l1').classList.toggle('sel',n===1);$('l2').classList.toggle('sel',n===2);try{localStorage.ln=n}catch(e){}pv()}
$('l1').onclick=()=>setLines(1);$('l2').onclick=()=>setLines(2);
try{if(localStorage.ln==='1')LINES=1}catch(e){}
setLines(LINES);
</script>
</body></html>
